<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Company - Campus Placement</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="company-page">

    <div class="company-card">

        <h1>Add Company</h1>
        <p class="subtitle">Add a new company placement opportunity</p>

        <form action="{{ url_for('add_company') }}" method="POST">

            <div class="form-group">
                <label>Company Name</label>
                <input type="text"
                       name="company_name"
                       placeholder="Example: TCS"
                       required>
            </div>

            <div class="form-group">
                <label>Job Role</label>
                <input type="text"
                       name="job_role"
                       placeholder="Example: Software Developer"
                       required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Salary / Package</label>
                    <input type="text"
                           name="salary"
                           placeholder="Example: 6 LPA"
                           required>
                </div>

                <div class="form-group">
                    <label>Minimum CGPA</label>
                    <input type="number"
                           name="min_cgpa"
                           step="0.01"
                           min="0"
                           max="10"
                           placeholder="Example: 7.00"
                           required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Eligible Department</label>
                    <input type="text"
                           name="eligible_department"
                           placeholder="Example: BCA, BSc CS"
                           required>
                </div>

                <div class="form-group">
                    <label>Eligible Year</label>
                    <input type="text"
                           name="eligible_year"
                           placeholder="Example: 3rd Year"
                           required>
                </div>

            </div>

            <div class="form-group">
                <label>Application Deadline</label>
                <input type="date"
                       name="deadline"
                       required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description"
                          rows="5"
                          placeholder="Enter company and job description"></textarea>
            </div>

            <button type="submit" class="add-company-btn">
                Add Company
            </button>

        </form>

        <a class="back-link"
           href="{{ url_for('admin_dashboard') }}">
            ← Back to Admin Dashboard
        </a>

    </div>

</div>

</body>
</html>
