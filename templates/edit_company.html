<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Company - Campus Placement System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #1d4ed8;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .update-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 7px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }

        .flash {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 7px;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <h2>
        Campus Placement System - Admin
    </h2>

    <a href="{{ url_for('admin_dashboard') }}">
        Dashboard
    </a>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- FLASH MESSAGES -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="card">

        <h1>
            ✏️ Edit Company
        </h1>

        <p class="subtitle">
            Update the company and placement information.
        </p>


        <!-- =========================
             EDIT FORM
        ========================== -->

        <form method="POST">


            <!-- COMPANY NAME -->

            <div class="form-group">

                <label for="company_name">
                    Company Name
                </label>

                <input
                    type="text"
                    id="company_name"
                    name="company_name"
                    value="{{ company.company_name }}"
                    required
                >

            </div>


            <!-- JOB ROLE -->

            <div class="form-group">

                <label for="job_role">
                    Job Role
                </label>

                <input
                    type="text"
                    id="job_role"
                    name="job_role"
                    value="{{ company.job_role }}"
                    required
                >

            </div>


            <!-- SALARY -->

            <div class="form-group">

                <label for="salary">
                    Salary / Package
                </label>

                <input
                    type="text"
                    id="salary"
                    name="salary"
                    value="{{ company.salary }}"
                    required
                >

            </div>


            <!-- MIN CGPA -->

            <div class="form-group">

                <label for="min_cgpa">
                    Minimum CGPA
                </label>

                <input
                    type="number"
                    id="min_cgpa"
                    name="min_cgpa"
                    value="{{ company.min_cgpa or '' }}"
                    step="0.01"
                    min="0"
                    max="10"
                >

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="eligible_department">
                    Eligible Department
                </label>

                <input
                    type="text"
                    id="eligible_department"
                    name="eligible_department"
                    value="{{ company.eligible_department or '' }}"
                    placeholder="Example: BCA, MCA, CSE"
                >

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label for="eligible_year">
                    Eligible Year
                </label>

                <input
                    type="text"
                    id="eligible_year"
                    name="eligible_year"
                    value="{{ company.eligible_year or '' }}"
                    placeholder="Example: 3rd Year"
                >

            </div>


            <!-- DEADLINE -->

            <div class="form-group">

                <label for="deadline">
                    Application Deadline
                </label>

                <input
                    type="date"
                    id="deadline"
                    name="deadline"
                    value="{{ company.deadline or '' }}"
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter company description..."
                >{{ company.description or '' }}</textarea>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn">

                    Update Company

                </button>


                <a
                    href="{{ url_for('company_management') }}"
                    class="cancel-btn">

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>


</body>

</html>
