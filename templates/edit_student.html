<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Campus Placement System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #1d4ed8;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .update-btn {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            display: block;
            text-align: center;
            margin-top: 12px;
            padding: 12px;
            background: #e5e7eb;
            color: #222;
            text-decoration: none;
            border-radius: 7px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>
        Campus Placement System - Admin
    </h2>

    <a href="{{ url_for('student_management') }}">
        Student Management
    </a>

</div>


<div class="container">

    <div class="card">

        <h1>Edit Student</h1>

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >


            <label>Register Number</label>

            <input
                type="text"
                name="register_no"
                value="{{ student.register_no }}"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                required
            >


            <label>Phone</label>

            <input
                type="text"
                name="phone"
                value="{{ student.phone }}"
                required
            >


            <label>Department</label>

            <input
                type="text"
                name="department"
                value="{{ student.department }}"
                required
            >


            <label>Year</label>

            <input
                type="text"
                name="year"
                value="{{ student.year }}"
                required
            >


            <button
                type="submit"
                class="update-btn"
            >
                Update Student
            </button>

        </form>


        <a
            href="{{ url_for('student_management') }}"
            class="cancel-btn"
        >
            Cancel
        </a>

    </div>

</div>

</body>

</html>
