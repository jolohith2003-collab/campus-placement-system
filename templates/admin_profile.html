<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile - Campus Placement System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #1d4ed8;
            padding: 10px 18px;
            border-radius: 6px;
            margin-left: 8px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .username {
            background: #f1f5f9;
        }

        .update-btn {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>Campus Placement System</h2>

        <div>
            <a href="{{ url_for('admin_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('admin_logout') }}">
                Logout
            </a>
        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>Admin Profile</h1>

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}


            <form method="POST">

                <label>Username</label>

                <input
                    type="text"
                    value="{{ admin.username }}"
                    class="username"
                    readonly
                >


                <label>Current Password</label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >


                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >


                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >


                <button
                    type="submit"
                    class="update-btn">
                    Change Password
                </button>

            </form>


            <a
                href="{{ url_for('admin_dashboard') }}"
                class="back">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>
</html>
